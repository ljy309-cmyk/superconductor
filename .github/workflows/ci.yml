name: Superconductor CI

on:
  push:
    branches: [main, develop, "claude/*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check (warnings are errors)
        run: ruff check . --exit-non-zero-on-fix

      - name: Check formatting (warnings are errors)
        run: ruff format --check --diff .

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib requests flask
          pip install pytest pytest-cov hypothesis

      - name: Run unit tests with coverage (90% minimum, warnings as errors)
        run: |
          python -W error -m pytest tests/ -v --tb=short \
            --cov=. --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=90 -x -W default::DeprecationWarning

      - name: Check core imports
        run: |
          python -c "from config_loader import cfg; print('config_loader OK')"
          python -c "from logger import get_module_logger; print('logger OK')"
          python -c "from i18n import t, set_locale; print('i18n OK')"
          python -c "from presets import get_preset, list_presets; print('presets OK')"
          python -c "from report import generate_report; print('report OK')"
          python -c "from achievements import get_all_achievements; print('achievements OK')"
          python -c "from replay import ReplayRecorder; print('replay OK')"

      - name: Check physics/logic module imports
        run: |
          python -c "from quantum.tunneling_physics import QuantumParticle, _calc_tunnel_prob; print('tunneling_physics OK')"
          python -c "from quantum.qec_physics import QECQubit, build_grid; print('qec_physics OK')"
          python -c "from quantum.qubit_physics import QubitNode, QubitNetwork; print('qubit_physics OK')"
          python -c "from security.bb84_protocol import BB84Game, QubitPacket; print('bb84_protocol OK')"
          python -c "from security.squid_logic import SQUIDGame; print('squid_logic OK')"

      - name: Upload coverage report
        if: matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
