repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest
        name: pytest (all tests must pass + coverage >= 40%)
        entry: python -m pytest tests/ --cov=. --cov-report=term-missing:skip-covered
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
