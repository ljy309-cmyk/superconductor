[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "network-book-writer"
version = "0.1.0"
description = "네트워크 책 자동 집필 파이프라인 - 구글드라이브 연동, AI 토론 기반 문서 생성/수정"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "aiohttp>=3.9.0",
    "asyncio-pool>=0.6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pushover-complete>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
book-writer = "src.main:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
