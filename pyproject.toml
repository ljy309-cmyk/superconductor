[project]
name = "superconductor"
version = "1.0.0"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable name (physics uses l, I, etc.)
    "B905",  # zip without strict (Python 3.10+ strict param)
]

[tool.ruff.lint.per-file-ignores]
# F821: theme colors injected dynamically via load_pg_colors(_COLOR_MAP, globals())
"quantum/tunneling.py" = ["F821", "E402"]
"quantum/tunneling_render.py" = ["F821"]
"quantum/qec_shield.py" = ["F821"]
"quantum/qubit_chain.py" = ["F821"]
"security/bb84_defense.py" = ["F821"]
"security/squid_mines.py" = ["F821"]
"physics/flux_pinning.py" = ["F821", "E402"]
"physics/phase_transition_sim.py" = ["F821"]
# E402: imports after path setup or conditional imports
"data_ai/tc_predictor.py" = ["E402"]
"data_ai/qrng_logger.py" = ["E402"]
"physics/phase_transition.py" = ["E402"]
"theme.py" = ["E402"]
"tests/*" = ["E402"]
# F401: availability-check imports (try/except ImportError pattern)
"perf_monitor.py" = ["F401"]
"tests/test_new_modules.py" = ["F401"]
"tests/test_play_logger.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = [
    "config_loader",
    "theme",
    "i18n",
    "logger",
    "achievements",
    "replay",
    "stats_dashboard",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",                       # 모든 Python 워닝을 에러로 처리
    "ignore::DeprecationWarning",  # 외부 라이브러리 DeprecationWarning만 허용
    "ignore::UserWarning:matplotlib",  # matplotlib 백엔드 전환 워닝 허용
]
addopts = "--strict-markers --strict-config -x --tb=short"

[tool.coverage.run]
omit = [
    # Pygame UI 파일 (디스플레이/이벤트루프 필요 — 단위 테스트 불가)
    "main.py",
    "game_base.py",
    "achievement_toast.py",
    "preset_hud.py",
    "help_overlay.py",
    "quit_dialog.py",
    "game_summary.py",
    "difficulty_dialog.py",
    "tutorial.py",
    "glossary.py",
    "stats_dashboard.py",
    "replay_viewer.py",
    "profile_manager.py",
    "settings_panel.py",
    "ui/base_launcher.py",
    "ui/slider.py",
    "quantum/tunneling.py",
    "quantum/tunneling_render.py",
    "quantum/entanglement.py",
    "quantum/gate_builder.py",
    "quantum/qec_shield.py",
    "quantum/qubit_chain.py",
    "physics/cooper_pair.py",
    "physics/josephson_junction.py",
    "physics/flux_pinning.py",
    "physics/phase_transition.py",
    "physics/phase_transition_sim.py",
    "security/bb84_defense.py",
    "security/squid_mines.py",
    "security/qkd_advanced.py",
    "security/scada_security.py",
    "data_ai/launcher.py",
    "data_ai/ranking.py",
    "data_ai/qrng_logger.py",
    "data_ai/tc_predictor.py",
    "physics/launcher.py",
    "quantum/launcher.py",
    "security/launcher.py",
    "scada/dashboard.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
