[project]
name = "superconductor"
version = "1.0.0"
description = "Educational superconductor physics simulator"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable names (l, O, I)
    "B008",   # function call in default argument
]

[tool.ruff.lint.isort]
known-first-party = ["config_loader", "logger", "theme", "i18n", "presets", "achievements", "replay", "report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "venv/*", "*.pyc"]

[tool.coverage.report]
show_missing = true
skip_empty = true
